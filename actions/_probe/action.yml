# Sonda descartável, sem efeito nenhum.
#
# Ela existe para responder UMA pergunta antes de qualquer aplicação depender da
# action de deploy: **um repositório privado da organização consegue consumir uma
# action deste repositório, e com qual `permissions:`?**
#
# Se o `.github` for público, `permissions: {}` basta (o download é anônimo). Se
# for privado, é preciso ligar Settings → Actions → General → Access →
# "Accessible from repositories in the organization" **e** dar
# `permissions: contents: read` ao job — e aí `permissions: {}` falha no
# download, antes de rodar passo nenhum.
#
# De quebra, prova que `uses: <org>/.github/actions/<nome>@<ref>` faz parse com um
# repositório chamado `.github`.
#
# O chamador é um workflow de `workflow_dispatch` em runner HOSPEDADO, no
# repositório da aplicação — não aqui: rodar isto dentro do próprio `.github` não
# provaria nada sobre acesso entre repositórios.
name: Sonda de acesso
description: Prova que um repositório da organização consegue baixar uma action deste repositório

outputs:
  ok:
    description: Sempre "ok" quando a action foi baixada e executada.
    value: ${{ steps.probe.outputs.ok }}

runs:
  using: composite
  steps:
    - id: probe
      shell: bash
      run: |
        printf 'a action foi baixada e executada\n'
        printf '  repositório chamador: %s\n' "${GITHUB_REPOSITORY:-?}"
        printf '  ref da action ......: %s\n' "${GITHUB_ACTION_REF:-?}"
        printf '  ambiente do runner .: %s\n' "${RUNNER_ENVIRONMENT:-?}"
        printf 'ok=ok\n' >> "$GITHUB_OUTPUT"
