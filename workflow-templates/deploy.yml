# Deploy de produção. Este arquivo é só o GATILHO — o pipeline é a action.
#
# Copie-o para `.github/workflows/deploy.yml` do repositório da aplicação e mexa
# em duas coisas: a **label da máquina** no `runs-on` e a **versão** da action.
# O resto dos fatos da aplicação mora no `deploy.conf`, ao lado do compose.
#
# O padrão: devs/engineering/deploy-standard.md
name: deploy

on:
  # Merge de PR **é** push na branch de deploy — squash, merge commit ou
  # fast-forward, dá no mesmo aqui. Não existe gatilho de `pull_request` de
  # propósito: não há homologação para onde subir um PR, e subir branch não
  # revisado em produção seria o oposto do que o review existe para fazer.
  push:
    branches: [$default-branch]

  # Rollback, redeploy e conferência, sem SSH.
  workflow_dispatch:
    inputs:
      sha:
        description: SHA curto para ROLLBACK (vazio sobe o HEAD da branch)
        required: false
        type: string
      mode:
        description: deploy | dry-run | doctor
        required: false
        default: deploy
        type: choice
        options: [deploy, dry-run, doctor]

# Serializa por repositório. A serialização entre APLICAÇÕES da mesma VM é a
# trava de arquivo da action — o GitHub não sabe que elas dividem a máquina.
#
# `cancel-in-progress: false` porque cancelar um deploy no meio deixaria produção
# em estado indefinido, entre o migrate e o `up -d`.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

# `contents: read` é o mínimo para o runner baixar a action quando o repositório
# `.github` é privado. Se ele for público, `{}` também funciona.
permissions:
  contents: read

jobs:
  deploy:
    # ⚠️ Label da MÁQUINA, não da aplicação: com várias aplicações na mesma VM,
    # uma label com nome de app mente. Errar a label não dá erro — o job fica
    # enfileirado até o GitHub desistir dele em 24h.
    runs-on: [self-hosted, linux, prd-apps-1]

    # O build roda nesta VM e pode esperar a trava de outra aplicação.
    timeout-minutes: 60

    steps:
      # Sem `actions/checkout`, de propósito: o deploy sobe de `/srv/<repo>`, que
      # é onde vivem o `.env.prod` e o estado. Um segundo clone no `_work` do
      # runner seria uma segunda verdade sobre o que está no ar.
      - uses: Softilux-Desenvolvimento-de-Sistemas/.github/actions/deploy@v1.0.0
        with:
          sha: ${{ inputs.sha }}
          mode: ${{ inputs.mode || 'deploy' }}
